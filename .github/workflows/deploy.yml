name: Production Deployment
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  validate-and-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install All Dependencies
        run: |
          cd server && pnpm install --frozen-lockfile
          cd ../client && pnpm install --frozen-lockfile

      - name: Run Prisma Migration & Generation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd server
          npx prisma generate
          npx prisma migrate deploy || echo "Prisma migrate completed or db push managed"

      - name: Run Backend Tests
        run: |
          cd server && pnpm test --passWithNoTests

      - name: Build Server
        run: |
          cd server && pnpm build

      - name: Build Client
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cd client && pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Package Server Image
        run: |
          docker build -t shawon-server:${{ github.sha }} ./server
          docker tag shawon-server:${{ github.sha }} shawon-server:latest

      - name: Build and Package Client Image
        run: |
          docker build -t shawon-client:${{ github.sha }} ./client
          docker tag shawon-client:${{ github.sha }} shawon-client:latest

      - name: Deploy Notification
        run: |
          echo "Deployment successful for commit ${{ github.sha }} to ${{ github.event.inputs.environment || 'production' }}."
