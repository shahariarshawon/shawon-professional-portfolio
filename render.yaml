# Render Blueprint (must live at the repo root). Deploys the Express API from /server.
services:
  - type: web
    name: shawon-portfolio-backend
    runtime: node
    rootDir: server
    buildCommand: pnpm install --frozen-lockfile --filter shawon-portfolio-server... && pnpm run build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      # Generated once by Render; no manual step needed.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Your Vercel URL(s), comma-separated, no trailing slash.
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
